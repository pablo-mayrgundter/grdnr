name: Build the garden site
description: Install, test, and build the static site into dist/. The build works at any URL path.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Test
      shell: bash
      run: npm test

    - name: Build
      shell: bash
      run: npm run build && touch dist/.nojekyll
