name: PR preview

# Deploys a live preview of every PR to https://grdnr.life/pr-preview/pr-<N>/
# and removes it when the PR closes. Previews live on the gh-pages branch under
# pr-preview/, next to the main deploy at the root (pages.yml).
# A preview is on the same site as the main deploy, and browser storage belongs
# to the site, so a preview opens the real garden, and changes made in it are real.

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/build

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1.8.1
        with:
          source-dir: dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          pages-base-url: grdnr.life
          action: deploy

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove preview
        uses: rossjrw/pr-preview-action@v1.8.1
        with:
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: remove
